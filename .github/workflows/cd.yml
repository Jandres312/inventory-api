

name: CD Pipeline

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to VM via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.yml,Dockerfile,nginx.conf,.env.example,requirements.txt,app/"
          target: "/home/${{ secrets.VM_USER }}/inventory-api"

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VM_USER }}/inventory-api
            cp .env.example .env
            docker compose down
            docker compose up -d --build
            sleep 10
            curl -f http://localhost:8000/health || exit 1
            echo "Deploy successful!"